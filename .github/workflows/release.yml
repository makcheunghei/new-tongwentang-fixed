name: Release build

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run test:tsc
          npm run test:lint
          npm run test:unit

      - name: Build project
        run: npm run build:all

      - name: Package extensions
        run: |
          npm run build:zip:firefox
          npm run build:zip:chromium

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            web-ext-artifacts/new-tongwentang-fixed-firefox.zip
            web-ext-artifacts/new-tongwentang-fixed-chromium.zip
