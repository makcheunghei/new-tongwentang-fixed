name: CI

on:
  push:
    branches:
      - master
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run test:tsc

      - name: Lint
        run: npm run test:lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build all targets
        run: npm run build:all

      - name: Validate WebExtension manifest
        run: |
          npm run test:webext
          npm run test:build

      - name: Build extension archives
        run: |
          npm run build:zip:firefox
          npm run build:zip:chromium

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: tongwentang-extension
          path: web-ext-artifacts/*
          if-no-files-found: error

  safari:
    runs-on: macos-latest
    env:
      SAFARI_PROJECT_LOCATION: build/apple/ci-project
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Safari extension bundle
        run: npm run build:safari

      - name: Generate Safari Xcode project
        run: npm run safari:convert

      - name: Validate Safari extension bundle
        run: node scripts/verify-build.mjs safari

      - name: Build macOS wrapper without signing
        run: node scripts/safari-build.mjs macos build
        env:
          SAFARI_UNSIGNED: '1'

      - name: Build iPhone and iPad simulator wrapper
        run: node scripts/safari-build.mjs ios simulator
