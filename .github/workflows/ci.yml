name: CI

on:
  push:
    branches:
      - master
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run test:tsc

      - name: Lint
        run: npm run test:lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build all targets
        run: npm run build:all

      - name: Validate WebExtension manifest
        run: npm run test:webext

      - name: Build extension archives
        run: |
          npm run build:zip:firefox
          npm run build:zip:chromium

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: tongwentang-extension
          path: web-ext-artifacts/*
          if-no-files-found: error

  safari:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Safari extension bundle
        run: npm run build:safari

      - name: Generate Safari Xcode project
        run: npm run safari:convert

      - name: Build Safari wrapper
        run: >-
          xcodebuild -project 'safari/TongWenTangFixed/TongWenTangFixed.xcodeproj' -scheme TongWenTangFixed
          -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
