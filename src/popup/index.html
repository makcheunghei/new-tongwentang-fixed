<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>新同文堂（修復）</title>
    <link rel="stylesheet" href="mobile.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="popup-page">
    <main>
      <header>
        <span class="app-symbol" aria-hidden="true"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 5h11M8.5 3v2M5 8c1 4 4 6 8 7M12 5c-1 5-4 8-8 10M13 21l4-11 4 11M14.5 17h5" /></svg
        ></span>
        <div>
          <h1>新同文堂</h1>
          <p id="hint">轉換目前網頁</p>
        </div>
      </header>
      <div class="actions">
        <button type="button" id="s2t" class="conversion-action">
          <span class="direction-symbol" aria-hidden="true">繁</span
          ><span><strong>轉為繁體</strong><small>簡體 → 繁體</small></span
          ><svg
            class="action-arrow"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            aria-hidden="true"
          >
            <path d="m9 5 7 7-7 7" />
          </svg>
        </button>
        <button type="button" id="t2s" class="conversion-action">
          <span class="direction-symbol" aria-hidden="true">简</span
          ><span><strong>轉為簡體</strong><small>繁體 → 簡體</small></span
          ><svg
            class="action-arrow"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            aria-hidden="true"
          >
            <path d="m9 5 7 7-7 7" />
          </svg>
        </button>
        <button type="button" id="auto" class="auto-action">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <path d="M4 7h15m-4-4 4 4-4 4M20 17H5m4-4-4 4 4 4" /></svg
          ><span>自動判斷方向</span>
        </button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <button type="button" id="settings" class="settings-action">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M4 6h16M4 12h16M4 18h16M9 3v6M15 9v6M8 15v6" /></svg
        ><span>設定與詞庫</span><span class="settings-arrow" aria-hidden="true">›</span>
      </button>
    </main>
  </body>
</html>
